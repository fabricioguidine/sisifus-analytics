version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-dev:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pre-commit"
          - "nbqa"
          - "nbstripout"
          - "jupytext"
      python-runtime:
        patterns:
          - "pandas"
          - "plotly"
          - "tqdm"
          - "python-dotenv"
          - "beautifulsoup4"
          - "lxml"
          - "python-dateutil"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore(ci)"
